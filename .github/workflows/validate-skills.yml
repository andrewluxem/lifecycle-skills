name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not tag-pinned: a mutable @v4 tag can be moved to point at
      # new code. Pin the commit and Dependabot bumps it via PR you can review.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate skills (stdlib only, no install step)
        run: python scripts/validate_skills.py
